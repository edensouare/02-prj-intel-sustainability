  <rect x="235" y="175" width="170" height="130" rx="8" fill="#0071c5"/>
  <path d="M270 215h100M270 245h100M270 275h65" stroke="#f4f6f8" stroke-width="12" stroke-linecap="round"/>
  <text x="320" y="425" fill="#17324d" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="middle">4004 / 1971</text>
